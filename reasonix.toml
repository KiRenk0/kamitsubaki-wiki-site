'.tmp-d667.html',encoding='utf-8').read()\ni=h.find('Release')\nprint(repr(h[i-160:i+220]))\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\nconst d=require('./scripts/data/grp-netease.json');\nconsole.log('total:', d.length);\nconst missingDur = d.filter(x=>!x.durationMs).length;\nconst missingCover = d.filter(x=>!x.coverUrl).length;\nconst emptyLyric = d.filter(x=>!x.lyric).length;\nconst noPublish = d.filter(x=>!x.publishTime).length;\nconsole.log('missing duration:', missingDur, '| missing cover:', missingCover, '| empty lyric:', emptyLyric, '| no publish:', noPublish);\nconsole.log('---check suspicious matches---');\nfor (const x of d) {\n  if (x.name !== x.queryTitle || !x.artist.includes(x.queryArtist)) {\n    console.log('DIFF:', x.queryTitle, '->', x.name, '|', x.artist);\n  }\n}\nconsole.log('---durations---');\nfor (const x of d) { const ms=x.durationMs; if(ms) console.log(x.name, (ms/1000/60).toFixed(2)); }\n\" 2>&1 | head -50", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\nconst params = new URLSearchParams({s:'クロマティック 心世紀 ヰ世界情緒', type:'1', offset:'0', limit:'10'});\nfetch('https://music.163.com/api/search/get?'+params, {headers:{'User-Agent':'Mozilla/5.0','Referer':'https://music.163.com'}}).then(r=>r.json()).then(d=>{\n  for (const s of (d.result?.songs??[]).slice(0,5)) console.log(s.id, s.name, '|', s.artists.map(a=>a.name).join('/'), '|', s.album.name, '|', s.album.blurPicUrl?.slice(0,80));\n});\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\nconst params = new URLSearchParams({s:'クロマティック ヰ世界情緒', type:'1', offset:'0', limit:'10'});\nfetch('https://music.163.com/api/search/get?'+params, {headers:{'User-Agent':'Mozilla/5.0','Referer':'https://music.163.com'}}).then(r=>r.json()).then(d=>{\n  for (const s of (d.result?.songs??[]).slice(0,8)) console.log(s.id, s.name, '|', s.artists.map(a=>a.name).join('/'), '|', s.album.name, '|', s.duration, '|', s.album.publishTime);\n});\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\nconst fs=require('fs');\nconst d=JSON.parse(fs.readFileSync('scripts/data/grp-netease.json','utf8'));\n(async()=>{\n  const songId=3322028744;\n  const lyricRes=await fetch('https://music.163.com/api/song/lyric?id='+songId+'&lv=1&kv=1&tv=-1',{headers:{'User-Agent':'Mozilla/5.0','Referer':'https://music.163.com'}});\n  const lyric=(await lyricRes.json())?.lrc?.lyric ?? '';\n  const idx=d.findIndex(x=>x.queryTitle==='クロマティック');\n  d[idx]={...d[idx], neteaseId:songId, name:'クロマティック', artist:'少女革命計画 / ヰ世界情緒', album:'クロマティック', durationMs:324367, publishTime:1766505600000, coverUrl:'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg', lyric};\n  fs.writeFileSync('scripts/data/grp-netease.json', JSON.stringify(d,null,2));\n  console.log('updated, lyric len:', lyric.length);\n})();\n\" && node -e \"\nconst d=require('./scripts/data/grp-netease.json');\nconst urls=[...new Set(d.map(x=>x.coverUrl).filter(Boolean))];\nconsole.log('unique cover urls:', urls.length);\n\""]
