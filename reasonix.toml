umId, {headers:{'User-Agent':'Mozilla/5.0','Referer':'https://music.163.com'}})).json();\n  console.log('album name:', a.album?.name);\n  console.log('picUrl:', a.album?.picUrl);\n  console.log('blurPicUrl:', a.album?.blurPicUrl);\n})();\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\n(async()=>{\n  const r=await (await fetch('https://music.163.com/api/album/366802079', {headers:{'User-Agent':'Mozilla/5.0','Referer':'https://music.163.com'}})).json();\n  console.log(JSON.stringify(r).slice(0,500));\n})();\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\n(async()=>{\n  const r=await (await fetch('https://music.163.com/api/song/detail?ids=[366802079]', {headers:{'User-Agent':'Mozilla/5.0','Referer':'https://music.163.com'}})).json();\n  const s=r.songs?.[0];\n  console.log('song:', s?.name);\n  console.log('album:', s?.album?.name);\n  console.log('picUrl:', s?.album?.picUrl);\n  console.log('blurPicUrl:', s?.album?.blurPicUrl);\n})();\n\"", "Bash=cd /f/kamitsubaki-wiki-site && python3 -c \"\nimport base64\ndef cover_url(pid):\n    h = hex(int(pid))[2:]\n    if len(h) % 2: h = '0' + h\n    b = bytes.fromhex(h)\n    enc = base64.b64encode(b).decode().replace('+','-').replace('/','_')\n    return f'https://p1.music.126.net/{enc}/{pid}.jpg'\nprint(cover_url(5639395138885805))\nprint('expected: https://p1.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg')\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\n(async()=>{\n  const term=encodeURIComponent('桜心中 御莉姫');\n  const r=await (await fetch('https://itunes.apple.com/search?term='+term+'&entity=song&limit=5',{headers:{'User-Agent':'Mozilla/5.0'}})).json();\n  for (const s of r.results) console.log(s.trackName,'|',s.artistName,'|',s.trackTimeMillis,'|',s.releaseDate,'|',s.artworkUrl100);\n})();\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node scripts/fetch-grp-itunes.mjs 2>&1 | grep -E \"FAIL|Done\"; echo \"---sample---\"; node -e \"\nconst d=require('./scripts/data/grp-itunes.json');\nfor (const x of d.slice(0,5)) console.log(x.queryTitle,'->',x.trackName,'|',x.artistName,'|',x.releaseDate,'|',x.artworkUrl?.slice(-40));\nconsole.log('total:', d.length, 'fails:', d.filter(x=>x.error).length);\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\n(async()=>{\n  const fs=require('fs');\n  const d=JSON.parse(fs.readFileSync('scripts/data/grp-itunes.json','utf8'));\n  const failed=d.filter(x=>x.error);\n  const hd=(u)=>u.replace(/\\/\\d+x\\d+bb\\.(jpg|png|webp)\\$/u,'/1000x1000bb.\\$1');\n  const norm=(s)=>(s||'').replace(/[\\s（）()]/g,'').toLowerCase();\n  for (const f of failed) {\n    let term = encodeURIComponent(f.queryTitle+' '+f.queryArtist);\n    if (f.queryTitle==='クロマティック') term = encodeURIComponent('クロマティック ヰ世界情緒');\n    if (f.queryTitle==='主人行路') term = encodeURIComponent('主人行路 SINSEIKI');\n    try {\n      const r=await fetch('https://itunes.apple.com/search?term='+term+'&entity=song&country=JP&limit=10',{headers:{'User-Agent':'Mozilla/5.0'}});\n      if (!r.ok) throw new Error('HTTP '+r.status);\n      const data=await r.json();\n      const tracks=data.results??[];\n      const t=tracks.find(x=>norm(x.trackName)===norm(f.queryTitle)) ?? tracks[0];\n      if (!t) throw new Error('not found');\n      Object.assign(f,{trackName:t.trackName,artistName:t.artistName,albumName:t.collectionName,durationMs:t.trackTimeMillis,releaseDate:(t.releaseDate||'').slice(0,10),artworkUrl:hd(t.artworkUrl100),trackViewUrl:t.trackViewUrl,collectionViewUrl:t.collectionViewUrl,error:undefined});\n      console.log('OK', f.queryTitle,'->',t.trackName,'|',t.artistName);\n    } catch(e) { console.log('STILL FAIL', f.queryTitle, e.message); }\n    await new Promise(r=>setTimeout(r,2000));\n  }\n  fs.writeFileSync('scripts/data/grp-itunes.json', JSON.stringify(d,null,2));\n  console.log('remaining fails:', d.filter(x=>x.error).length);\n})();\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\n(async()=>{\n  const norm=(s)=>(s||'').replace(/[\\s（）()]/g,'').toLowerCase();\n  for (const term of ['主人行路','The Road','Master'] ) {\n    const r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(term)+'&entity=song&country=JP&limit=20',{headers:{'User-Agent':'Mozilla/5.0'}});\n    const data=await r.json();\n    for (const t of (data.results??[]).slice(0,20)) {\n      const who=(t.artistName||'')+(t.collectionName||'');\n      if (/SINSEIKI|TSUMITOBATSU|少女革命|心世紀|罪十罰/i.test(who) || norm(t.trackName).includes('主人行路')) {\n        console.log(t.trackName,'|',t.artistName,'|',t.collectionName);\n      }\n    }\n  }\n})();\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\n(async()=>{\n  const fs=require('fs');\n  const d=JSON.parse(fs.readFileSync('scripts/data/grp-itunes.json','utf8'));\n  const f=d.find(x=>x.queryTitle==='主人行路');\n  const r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent('主人行路 矢野達也')+'&entity=song&country=JP&limit=5',{headers:{'User-Agent':'Mozilla/5.0'}});\n  const t=(await r.json()).results[0];\n  const hd=(u)=>u.replace(/\\/\\d+x\\d+bb\\.(jpg|png|webp)\\$/u,'/1000x1000bb.\\$1');\n  Object.assign(f,{trackName:t.trackName,artistName:t.artistName,albumName:t.collectionName,durationMs:t.trackTimeMillis,releaseDate:(t.releaseDate||'').slice(0,10),artworkUrl:hd(t.artworkUrl100),trackViewUrl:t.trackViewUrl,collectionViewUrl:t.collectionViewUrl,error:undefined});\n  fs.writeFileSync('scripts/data/grp-itunes.json', JSON.stringify(d,null,2));\n  console.log('fixed:', f.trackName, f.releaseDate, f.durationMs);\n  console.log('remaining fails:', d.filter(x=>x.error).length);\n})();\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\nconst d=require('./scripts/data/grp-netease.json');\nconst track=d.find(x=>x.queryTitle==='桜心中');\nconst fs=require('fs');\nfs.writeFileSync('scripts/data/test-lyric.txt', track.lyric);\nconsole.log(track.lyric.slice(0,500));\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\nimport('./scripts/grp-furigana.mjs').then(async (m)=>{\n  const fs=require('fs');\n  const lyric=fs.readFileSync('scripts/data/test-lyric.txt','utf8');\n  const lines=m.parseLrcToLines(lyric).slice(0,12);\n  for (const line of lines) {\n    const match=line.match(/^(\\[\\d{1,2}:\\d{2}(?:\\.\\d+)?\\])([\\s\\S]*)\\$/u);\n    const ts=match[1], text=match[2].trim();\n    const ann=text?await m.annotateLyricLine(text):'';\n    console.log(ts+ann);\n  }\n});\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\nimport('./scripts/grp-furigana.mjs').then(async (m)=>{\n  const fs=require('fs');\n  const lyric=fs.readFileSync('scripts/data/test-lyric.txt','utf8');\n  const lines=m.parseLrcToLines(lyric).slice(0,14);\n  for (const line of lines) {\n    const match=line.match(/^(\\[\\d{1,2}:\\d{2}(?:\\.\\d+)?\\])([\\s\\S]*)\\$/u);\n    const ts=match[1], text=match[2].trim();\n    const ann=text?await m.annotateLyricLine(text):'';\n    console.log(ts+ann);\n  }\n});\n\"", "Bash=cd /f/kamitsubaki-wiki-site && for d in src/content/songs/{orihime,kakyoin,garasumiya,mikoto,yunagi,hinageshi,sinseiki,tsumitobatsu,grp}; do rm -rf \"$d\"; done; echo \"cleaned song dirs\"", "Bash=cd /f/kamitsubaki-wiki-site && python3 - << 'EOF'\nimport re\np = 'scripts/grp-generate.mjs'\ns = open(p, encoding='utf-8').read()\n\n# Add slug column to SONGS: replace the list entries with 5-tuples\nslug_map = {\n    '桜心中': 'sakura-shinjuu', 'さよなら、楽園': 'sayonara-rakuen', '雑几帖': 'zatsukichou',\n    '侵蝕の記録': 'shinshoku-no-kiroku', '大罪': 'taizai', 'sweet/sour': 'sweet-sour',\n    'クロマティック': 'chromatic', '化け物でいさせて': 'bakemono-de-isasete',\n    'Masquerade Kill': 'masquerade-kill', '月へゆく': 'tsuki-e-yuku', '改変 -罪-': 'kaihen-tsumi',\n    '改変 -心-': 'kaihen-kokoro', '改変': 'kaihen', '主人行路': 'shujin-kouro',\n    '鈍色幻灯': 'nibiiro-gentou', 'SURVIVAL': 'survival', 'ミリオン・コンプレクシティ': 'million-complexity',\n    'SHOCK': 'shock', 'Yellow Yellow': 'yellow-yellow', '回想の層': 'kaisou-no-sou',\n    'ホンキートンキーラブ': 'honky-tonky-love', 'うそ鳴き': 'usonaki', 'unknown': 'unknown',\n    'キリガサガリキ': 'kirigasa-gariki', 'ANGER': 'anger', 'blindness': 'blindness',\n    'ココロト': 'kokoroto', '瞬き': 'mabataki', 'シネマティック': 'cinematic',\n    'ガラスのパズル': 'glass-no-puzzle', 'Synapse': 'synapse', 'Ephemeral': 'ephemeral',\n    'アワセカガミ': 'awase-kagami', 'Talking Doll': 'talking-doll', 'プレイヤーわたし': 'player-watashi',\n    '宇宙逃避行': 'uchu-touhikou', 'ジャンク': 'junk', 'アイ': 'ai', '現世回帰': 'gense-kaiki',\n    'セルフィッシュ': 'selfish', 'シンユウ': 'shin-yuu', 'アバウト': 'about', '夢の揺籠': 'yume-no-yurikago',\n    'アライブ': 'alive', 'well': 'well', 'DIGGER': 'digger', 'パーフェクション': 'perfection',\n    '弔花': 'chouka', 'フェイクナイト・シンデレラ': 'fake-night-cinderella', 'ロストオービット': 'lost-orbit',\n    'いずれ僕は溶けて': 'izure-boku-wa-tokete', 'コントラスト': 'contrast', 'FantastiQ': 'fantasti-q',\n    'RAVEN': 'raven', 'アウフヘーベン': 'aufheben', 'Brrrrrreak It': 'brrrrrreak-it', 'Envy': 'envy',\n}\n\ndef add_slug(match):\n    title = match.group(1)\n    rest = match.group(2)\n    slug = slug_map.get(title, 'track')\n    return f\"  ['{title}',{rest} '{slug}'],\"\n\n# rewrite entries like  ['桜心中', '御莉姫', 'orihime', 'originals'],\ns = re.sub(r\"\\s*\\['([^']+)',\\s*'([^']+)',\\s*'([^']+)',\\s*'([^']+)'\\],\", add_slug, s)\n\n# update destructuring\ns = s.replace(\"for (const [title, officialArtist, artistId, category] of SONGS) {\",\n              \"for (const [title, officialArtist, artistId, category, slugOverride] of SONGS) {\")\ns = s.replace(\"const slug = toSlug(title);\", \"const slug = slugOverride ?? toSlug(title);\")\nopen(p, 'w', encoding='utf-8').write(s)\nprint('patched')\nEOF\nnode -e \"\nimport('./scripts/grp-generate.mjs').catch(e=>console.error('import err:', e.message.slice(0,200)));\n\" && head -8 scripts/grp-generate.mjs | tail -3", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\nconst {SONGS}=await import('./scripts/grp-generate.mjs');\nconst fs=require('fs');\nconst valid=new Set(SONGS.map(s=>s[4]));\nconst files=fs.readdirSync('scripts/data/grp-lyrics-raw');\nlet removed=0;\nfor (const f of files) {\n  const slug=f.replace(/\\.txt$/,'');\n  if (!valid.has(slug)) { fs.unlinkSync('scripts/data/grp-lyrics-raw/'+f); removed++; }\n}\nconsole.log('removed', removed, 'stale files; remaining:', fs.readdirSync('scripts/data/grp-lyrics-raw').length);\nconst groups=[];\nconst all=[...SONGS];\nwhile(all.length) groups.push(all.splice(0,6).map(s=>s[4]));\nfs.writeFileSync('scripts/data/grp-translation-groups.json', JSON.stringify(groups,null,2));\nconsole.log('groups:', groups.length);\nfor (const [i,g] of groups.entries()) console.log(i+1, g.join(', '));\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node --input-type=module -e \"\nimport {SONGS} from './scripts/grp-generate.mjs';\nimport {readdirSync, unlinkSync, writeFileSync} from 'node:fs';\nconst valid=new Set(SONGS.map(s=>s[4]));\nconst files=readdirSync('scripts/data/grp-lyrics-raw');\nlet removed=0;\nfor (const f of files) {\n  const slug=f.replace(/\\.txt$/,'');\n  if (!valid.has(slug)) { unlinkSync('scripts/data/grp-lyrics-raw/'+f); removed++; }\n}\nconsole.log('removed', removed, '; remaining:', readdirSync('scripts/data/grp-lyrics-raw').length);\nconst groups=[];\nconst all=[...SONGS];\nwhile(all.length) groups.push(all.splice(0,6));\nwriteFileSync('scripts/data/grp-translation-groups.json', JSON.stringify(groups,null,2));\nconsole.log('groups:', groups.length);\nfor (const [i,g] of groups.entries()) console.log(i+1, g.map(s=>s[4]).join(', '));\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\nconst it=require('./scripts/data/grp-itunes.json');\nfor (const slug of ['kaihen-kokoro','kaihen-tsumi']) {\n  const x=it.find(i=>i.queryTitle.includes(slug==='kaihen-kokoro'?'心':'罪'));\n  console.log(slug, '|', x.trackName, '|', x.albumName, '|', x.releaseDate, '|', x.collectionViewUrl);\n}\nconst ne=require('./scripts/data/grp-netease.json');\nfor (const t of ['改変 -心-','改変 -罪-']) {\n  const n=ne.find(x=>x.queryTitle===t);\n  console.log(t, 'album:', n.album, 'dur:', n.durationMs);\n}\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\n(async()=>{\n  for (const term of ['改変 -心- 心世紀','改変 -罪- 罪十罰']) {\n    const r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(term)+'&entity=album&country=JP&limit=5',{headers:{'User-Agent':'Mozilla/5.0'}});\n    const d=await r.json();\n    for (const a of (d.results??[]).slice(0,5)) {\n      console.log(a.collectionName,'|',a.artistName,'|',a.collectionId,'|',a.trackCount,'|',a.releaseDate,'|',a.collectionViewUrl);\n      console.log('  art:', a.artworkUrl100?.replace(/\\/\\d+x\\d+bb\\./,'/1000x1000bb.'));\n    }\n  }\n})();\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\nconst fs=require('fs');\nfor (const f of fs.readdirSync('scripts/data/grp-translations').filter(f=>f.startsWith('part-'))) {\n  const d=JSON.parse(fs.readFileSync('scripts/data/grp-translations/'+f,'utf8'));\n  if (d.about) {\n    console.log('found about in', f, 'zh:', d.about.zh.length, 'en:', d.about.en.length);\n    console.log('en[0]:', JSON.stringify(d.about.en[0]).slice(0,80));\n    console.log('en[5]:', JSON.stringify(d.about.en[5]).slice(0,80));\n  }\n}\n\"", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\nconst fs=require('fs');\nconst part=JSON.parse(fs.readFileSync('scripts/data/grp-translations/part-7.json','utf8'));\nconst content=fs.readFileSync('src/content/songs/yunagi/originals/about/en.md','utf8');\nconsole.log('current en.md bytes:', content.length);\nconst lines=part.about.en;\nconst re=new RegExp('\\\\\\\\{\\\\\\\\{__trans-lyric__(\\\\\\\\d+)__\\\\\\\\}\\\\\\\\}','gu');\nlet count=0;\nconst replaced=content.replace(re,(_,idx)=>{count++; const t=lines[Number(idx)]; return t===undefined?'':t.replace(/^\\[\\d{1,2}:\\d{2}(?:\\.\\d+)?\\]/u,'').trim();});\nconsole.log('placeholders matched:', count, '| replaced length:', replaced.length);\n\"", "Bash=sleep 20 && for url in \"zh/artists/girls_revolution_project/sinseiki\" \"zh/artists/girls_revolution_project/tsumitobatsu\" \"zh/artists/girls_revolution_project/grp\" \"zh/songs/orihime/originals/sakura-shinjuu\" \"zh/songs/sinseiki/originals/kaihen-kokoro\" \"zh/songs/grp/originals/kaihen\" \"zh/songs/grp/collaborations/chromatic\" \"zh/albums/sinseiki/kaihen-kokoro\" \"zh/albums/tsumitobatsu/kaihen-tsumi\" \"zh-hk/songs/orihime/originals/sakura-shinjuu\" \"en/songs/orihime/originals/sakura-shinjuu\"; do code=$(curl -s -o /dev/null -w \"%{http_code}\" \"http://localhost:4322/$url\"); echo \"$code /$url\"; done", "Bash=cd /f/kamitsubaki-wiki-site && tasklist //FI \"IMAGENAME eq node.exe\" 2>/dev/null | tail -2; echo \"---final summary---\"; echo \"songs(GRP): $(ls -d src/content/songs/{orihime,garasumiya,sinseiki,tsumitobatsu,mikoto,hinageshi,yunagi,kakyoin,grp}/*/*/ 2>/dev/null | wc -l)\"; echo \"albums(GRP): $(ls -d src/content/albums/{sinseiki,tsumitobatsu}/*/ 2>/dev/null | wc -l)\"; echo \"artists(GRP): $(ls -d src/content/artists/girls_revolution_project/*/ 2>/dev/null | wc -l)\"; echo \"covers: $(ls public/images/songs/grp/*.jpg public/images/albums/grp/*.jpg 2>/dev/null | wc -l)\"", "Bash=cd /f/kamitsubaki-wiki-site && grep -oE '<(img|figure|div)[^>]*(class|alt)=\"[^\"]*\"[^>]*>' .grp-artist.html | grep -iE \"ph_|2e81|efc6\" | head -10; echo \"---sizes---\"; for u in \"ph_orihime.png\" \"ph_kakyouin.png\" \"2e81a6d6bf9562a87a07124438370295.jpg\" \"efc6cdbbd8f4832addf00153281a6380.jpg\" \"ph_logo_sinseiki.svg\"; do curl -sI \"https://girlsrevolutionproject.jp/wp/wp-content/uploads/2024/07/$u\" | grep -iE \"content-length|content-type\" | tr '\\n' ' '; echo \"<- $u\"; done", "Bash=cd /f/kamitsubaki-wiki-site && mkdir -p public/images/artists && for pair in \"ph_orihime.png:orihime\" \"ph_kakyouin.png:kakyoin\" \"ph_garasumiya.png:garasumiya\" \"ph_mikoto.png:mikoto\" \"ph_yunagi.png:yunagi\" \"ph_hinageshi.png:hinageshi\" \"2e81a6d6bf9562a87a07124438370295.jpg:sinseiki\" \"efc6cdbbd8f4832addf00153281a6380.jpg:tsumitobatsu\"; do src=\"${pair%%:*}\"; name=\"${pair##*:}\"; curl -s --max-time 25 \"https://girlsrevolutionproject.jp/wp/wp-content/uploads/2024/07/$src\" -o \"public/images/artists/$name.jpg\" && echo \"OK $name.jpg $(stat -c%s public/images/artists/$name.jpg 2>/dev/null || wc -c < public/images/artists/$name.jpg)\"; done", "Bash=cd /f/kamitsubaki-wiki-site && curl -s --max-time 25 \"https://girlsrevolutionproject.jp/wp/wp-content/themes/grp/assets/img/top/mv/ph_main.jpg\" -o public/images/artists/grp.jpg && echo \"grp.jpg $(wc -c < public/images/artists/grp.jpg)\"; node -e \"\nconst {execSync}=require('child_process');\nconst fs=require('fs');\nfor (const f of fs.readdirSync('public/images/artists').filter(f=>f.endsWith('.jpg'))) {\n  // parse JPEG dimensions from SOF marker\n  const buf=fs.readFileSync('public/images/artists/'+f);\n  let i=2, w=0, h=0;\n  while (i<buf.length) {\n    if (buf[i]!==0xFF) { i++; continue; }\n    const m=buf[i+1];\n    if (m>=0xC0 && m<=0xCF && m!==0xC4 && m!==0xC8 && m!==0xCC) {\n      h=buf.readUInt16BE(i+5); w=buf.readUInt16BE(i+7); break;\n    }\n    i+=2+buf.readUInt16BE(i+2);\n  }\n  console.log(f, w+'x'+h);\n}\n\"", "Bash=cd /f/kamitsubaki-wiki-site && file public/images/artists/orihime.jpg public/images/artists/grp.jpg 2>/dev/null; node -e \"\nconst sharp = require('sharp');\n(async()=>{\n  const fs=require('fs');\n  for (const name of ['orihime','kakyoin','garasumiya','mikoto','yunagi','hinageshi']) {\n    const p='public/images/attists/'+name+'.jpg';\n    const img=sharp('public/images/artists/'+name+'.jpg');\n    const meta=await img.metadata();\n    console.log(name, meta.format, meta.width+'x'+meta.height);\n  }\n})();\n\"", "Bash=cd /f/kamitsubaki-wiki-site && for n in orihime kakyoin garasumiya mikoto yunagi hinageshi; do mv \"public/images/artists/$n.jpg\" \"public/images/artists/$n.png\"; done && ls public/images/artists/ && node -e \"\nconst fs=require('fs');\nconst path=require('path');\nconst map={orihime:'orihime.png',kakyoin:'kakyoin.png',garasumiya:'garasumiya.png',mikoto:'mikoto.png',yunagi:'yunagi.png',hinageshi:'hinageshi.png',sinseiki:'sinseiki.jpg',tsumitobatsu:'tsumitobatsu.jpg',grp:'grp.jpg'};\nconst base='src/content/artists/girls_revolution_project';\nlet updated=0;\nfor (const [slug,file] of Object.entries(map)) {\n  for (const loc of ['zh','ja','en']) {\n    const p=path.join(base,slug,loc+'.md');\n    if (!fs.existsSync(p)) { console.log('MISS',p); continue; }\n    let c=fs.readFileSync(p,'utf8');\n    const re=/image: \\\"?[^\\n]+\\\"?\\n/;\n    if (!re.test(c)) { console.log('NO-IMAGE',p); continue; }\n    c=c.replace(re, 'image: \\\"/images/artists/'+file+'\\\"\\n');\n    fs.writeFileSync(p,c);\n    updated++;\n  }\n}\nconsole.log('updated', updated, 'files');\n\"", "Bash=cd /f/kamitsubaki-wiki-site && head -8 \"src/content/artists/girls_revolution_project/orihime/zh.md\" | grep image; echo \"---youtube search test---\"; curl -s --max-time 25 \"https://www.youtube.com/results?search_query=%E6%A1%9C%E5%BF%83%E4%B8%AD+ORIHIME\" -A \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36\" -o .yt-test.html && node -e \"\nconst fs=require('fs');\nconst h=fs.readFileSync('.yt-test.html','utf8');\nconst m=h.match(/\\\"videoId\\\":\\\"([A-Za-z0-9_-]{11})\\\"/g);\nconsole.log('videoIds found:', m ? m.length : 0);\nif (m) console.log([...new Set(m)].slice(0,10).join('\\n'));\n\"", "Bash=for api in \"https://pipedapi.kavin.rocks\" \"https://api.piped.yt\" \"https://pipedapi.reallyaweso.me\"; do echo \"=== $api ===\"; curl -s --max-time 15 \"$api/search?q=%E6%A1%9C%E5%BF%83%E4%B8%AD+ORIHIME&filter=videos\" -H \"User-Agent: Mozilla/5.0\" | head -c 300; echo; done", "Bash=cd /f/kamitsubaki-wiki-site && node -e \"\nconst d=require('./scripts/data/grp-netease.json');\nfor (const x of d.filter(x=>x.name==='桜心中'||x.queryTitle==='桜心中')) console.log(x.queryTitle,'|',x.name,'|',x.neteaseId,'|',x.durationMs,'|',x.album);\n\"", "Bash=sleep 18 && echo \"---artist image---\"; curl -s \"http://localhost:4322/zh/artists/girls_revolution_project/orihime\" | grep -oE '/images/artists/orihime\\.png' | head -1; curl -s -o /dev/null -w \"art img http: %{http_code}\\n\" \"http://localhost:4322/images/artists/orihime.png\"; curl -s -o /dev/null -w \"grp img http: %{http_code}\\n\" \"http://localhost:4322/images/artists/grp.jpg\"; echo \"---song switcher---\"; curl -s \"http://localhost:4322/zh/songs/orihime/originals/sakura-shinjuu\" | grep -oE \"netease|apple-music|wiki-media-switcher|data-media-provider=\\\"[a-z-]+\\\"\" | sort | uniq -c; echo \"---pages---\"; for u in \"zh/artists/girls_revolution_project/grp\" \"zh-hk/songs/orihime/originals/sakura-shinjuu\" \"en/songs/grp/collaborations/chromatic\"; do echo \"$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4322/$u) /$u\"; done"]
